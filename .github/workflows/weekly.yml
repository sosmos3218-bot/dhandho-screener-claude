# 매주 전체(미국+한국+일본) Dhandho 스크리닝 → 스냅샷 → 퍼블리시 → 뉴스레터(무료/유료) 발송
#
# test-cloud-scan.yml 로 실측 검증됨(2026-07-05): 한국(pykrx) 11/11, 미국(yfinance) 40/40
# 성공 — "GitHub IP에서 pykrx가 막힌다"던 이전 가정은 근거 없음으로 확인되어 전체 스캔으로 전환.
#
# [필요한 GitHub Secrets]  (Settings → Secrets and variables → Actions)
#   BREVO_API_KEY        Brevo API 키
#   BREVO_PAID_LIST_ID   유료판 리스트 ID
#   BREVO_FREE_LIST_ID   무료판 리스트 ID
#   BREVO_SENDER_EMAIL   뉴스레터 발신자 이메일
#   BREVO_SENDER_NAME    뉴스레터 발신자 이름
#   HF_TOKEN             Hugging Face 계정 settings/tokens 에서 발급(Write 권한, 이 Space 대상)
#                         — 없으면 GitHub 에는 정상 반영되고 HF Space 반영만 건너뜀

name: weekly-dhandho-full-scan

on:
  schedule:
    # cron 은 UTC 기준. 월요일 08:00 KST = 일요일 23:00 UTC.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      send_newsletter:
        description: "실제 구독자에게 뉴스레터까지 발송할지 (테스트 실행은 false 권장)"
        type: boolean
        default: false

permissions:
  contents: write

# 같은 그룹의 주간 실행은 겹치지 않는다. 진행 중이면 다음 실행은 기다린다.
concurrency:
  group: weekly-dhandho-full
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 파이썬 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install --quiet -r requirements.txt

      - name: 전체 스캔(US+KR+JP) → 스냅샷 → 퍼블리시 → 뉴스레터(예약 실행 또는 send_newsletter=true 일 때만 Brevo 발송)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_PAID_LIST_ID: ${{ secrets.BREVO_PAID_LIST_ID }}
          BREVO_FREE_LIST_ID: ${{ secrets.BREVO_FREE_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          SHOULD_SEND: ${{ github.event_name == 'schedule' || inputs.send_newsletter == true }}
          DHANDHO_RUN_CACHE: "1"
        run: |
          # 같은 잡 안에서 한 번 더 시도한다. 이미 받은 티커는 DHANDHO_RUN_CACHE 가 다시 받지 않는다.
          ok=0
          for attempt in 1 2; do
            if [ "$SHOULD_SEND" = "true" ]; then
              python weekly_run.py && ok=1 && break
            else
              echo "ℹ️ 수동 실행(send_newsletter=false) — 스캔/스냅샷/퍼블리시만 하고 발송은 건너뜁니다."
              python weekly_run.py --no-send && ok=1 && break
            fi
            echo "⚠️ 스캔 시도 $attempt 실패. 성공한 티커는 캐시에 남고 다시 시도합니다."
            sleep 5
          done
          [ "$ok" = "1" ]

      - name: published/snapshots 변경분 커밋 → GitHub(origin)
        # 스캔, 퍼블리시, 발송이 실패하면 깨진 산출물을 main 에 올리지 않는다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published snapshots
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            PUBLISH_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "data: weekly publish ${PUBLISH_DATE}"
            git fetch origin main
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin HEAD:main; then
                  echo "push ok"
                  exit 0
                fi
              else
                # rebase 중 데이터 파일만 겹치면 이번 스캔(재생 중인 커밋)을 남긴다.
                if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                  git checkout --theirs -- published snapshots || true
                  git add published snapshots
                  GIT_EDITOR=true git rebase --continue || git rebase --abort || true
                fi
              fi
              echo "⚠️ rebase/push 실패 (시도 $attempt/3)"
              git rebase --abort 2>/dev/null || true
              sleep 4
            done
            echo "❌ main 반영 실패"
            exit 1
          fi

      - name: Hugging Face Space에도 반영
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_GIT_USER: ${{ secrets.HF_GIT_USER }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ℹ️ HF_TOKEN 미설정 — HF Space push 생략 (GitHub 반영은 완료됨)"
            exit 0
          fi
          # 토큰을 remote URL 에 넣지 않는다. askpass 가 환경변수만 읽는다.
          HF_NAME="${HF_GIT_USER:-sosmos}"
          git remote remove hf 2>/dev/null || true
          git remote add hf "https://huggingface.co/spaces/sosmos/dhandho-screener"
          ASKPASS=$(mktemp)
          chmod 700 "$ASKPASS"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            "  *Username*) printf '%s\\n' '$HF_NAME' ;;" \
            '  *) printf "%s\n" "$HF_TOKEN" ;;' \
            'esac' > "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          cleanup() { rm -f "$ASKPASS"; }
          trap cleanup EXIT
          for attempt in 1 2 3; do
            git fetch hf main -q || true
            if git push hf HEAD:main; then
              exit 0
            fi
            echo "⚠️ HF push 실패 (시도 $attempt/3) — 4초 후 재시도"
            sleep 4
          done
          echo "❌ HF push 3회 모두 실패 — GitHub 반영은 완료되어 있으니 수동으로 'git push hf main' 필요"
          exit 1

      - name: 산출물 업로드 (뉴스레터 + 스냅샷, 디버깅용)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dhandho-weekly
          path: |
            newsletter/
            snapshots/
          if-no-files-found: warn
